# Brolly Exam Prep — static SPA served by nginx.
#
#   docker compose up -d --build     build and start
#   docker compose logs -f frontend  follow the logs
#   docker compose down              stop and remove
#
# The site is then at http://localhost:3200

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: brollyexamprep-frontend:latest
    container_name: brollyexamprep-frontend

    # Host 3200 -> container 80. Override without editing this file:
    #   FRONTEND_PORT=8080 docker compose up -d
    ports:
      - "${FRONTEND_PORT:-3200}:80"

    restart: unless-stopped

    # Repeated here as well as in the Dockerfile so `docker compose ps`
    # reports health even when the image is pulled rather than built.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
