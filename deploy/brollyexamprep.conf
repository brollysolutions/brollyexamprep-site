# ══════════════════════════════════════════════════════════════════
#  HOST nginx (Ubuntu, port 80/443) — reverse proxy to the container.
#
#  This is NOT nginx.conf. That one runs *inside* the image and serves
#  the static dist/. This one runs on the server and is the missing
#  piece: without it the host nginx answers :80 with its default site
#  and the container on :3200 is never reached.
#
#  Install:
#    sudo cp deploy/brollyexamprep.conf /etc/nginx/sites-available/brollyexamprep
#    sudo ln -sf /etc/nginx/sites-available/brollyexamprep /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default    # drop the welcome page
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name brollyexamprep.com www.brollyexamprep.com;

    # Certbot writes its challenge files here; it must stay reachable
    # over plain HTTP even after the redirect below is added.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The container already sets caching, gzip and the security
    # headers, so this block only forwards.
    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # PDFs are streamed straight through rather than spooled to a
        # temp file first.
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Previous-paper PDFs are large; the default 1m would reject them
    # if an upload endpoint is ever added.
    client_max_body_size 25m;
}
