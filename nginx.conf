# ══════════════════════════════════════════════════════════════════
#  Serves the built SPA. Mirrors public/.htaccess so the container,
#  the Apache host and the Netlify deploy all behave the same way.
#
#  NOTE ON add_header: nginx does NOT inherit add_header directives
#  into a location block that declares its own. The three security
#  headers are therefore repeated in every location that sets one —
#  removing the duplicates silently drops them from those responses.
# ══════════════════════════════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Apache's `Options -Indexes`.
    autoindex off;

    # Large previous-paper PDFs stream fine, but be explicit about it.
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # ── Compression ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Hashed build assets — safe to cache forever ───────────────
    # Vite fingerprints these filenames, so a new deploy is a new URL.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Previous-paper PDFs ───────────────────────────────────────
    # Not fingerprinted, so cache for a month rather than forever.
    location ~* \.pdf$ {
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "public, max-age=2592000"      always;
        try_files $uri =404;
    }

    # ── HTML and JSON must revalidate ─────────────────────────────
    # Otherwise a browser keeps an old index.html and never picks up
    # the new asset hashes after a deploy.
    location ~* \.(?:html|json|webmanifest)$ {
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "no-cache, must-revalidate"    always;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # React Router owns every path that is not a real file, so unknown
    # URLs render index.html rather than a 404. The internal redirect
    # to /index.html re-enters the .html location above, which is what
    # keeps the shell uncached.
    location / {
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header X-Frame-Options        "SAMEORIGIN"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
